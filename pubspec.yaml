name: strawberry_trade
description: دفتر تجارة الفراولة العربي دون اتصال
publish_to: none
version: 1.0.0+10
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  sqflite_sqlcipher: 3.4.1
  sqflite_common: 2.5.14
  path: 1.9.1
  crypto: 3.0.7
  cryptography: 2.9.0
  firebase_core: 5.0.0
  firebase_auth: 7.0.0
  firebase_app_check: 0.5.0
  cloud_functions: 7.0.0
  connectivity_plus: 7.3.2
  path_provider: 2.1.6
  file_picker: 13.1.0
  share_plus: 13.3.1
  pdf: 3.13.1
  printing: 5.15.1
  uuid: 4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.4
  pointycastle: 4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/fonts/NotoSans-Regular.ttf
  fonts:
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
